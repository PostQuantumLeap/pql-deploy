<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 700" width="1020" height="700" role="img" aria-labelledby="t d">
  <title id="t">Post Quantum Leap deployment and integration architecture</title>
  <desc id="d">Users reach the application over HTTPS through Caddy, which terminates TLS and proxies to the Post Quantum Leap container on port 8000; that container stores everything in PostgreSQL 16. Sign-in is federated to Entra ID or any OIDC provider. All three containers run on one container platform: Docker, Podman, Azure Container Instances, or Kubernetes with a Helm chart. Two optional enterprise integration components sit between the application and your infrastructure: an enterprise proxy server that scans pass through, and the Bifröst remote engine, a container deployed inside an isolated segment such as a DMZ. Bifröst opens one outbound connection to the application and receives its work down it, so no inbound firewall rule is ever needed. The application scans network endpoints for TLS configuration, and a client scanner installed on hosts submits a cryptographic bill of materials back to the API. Bifröst both scans the hosts the application has no route to and relays the CBOM from client scanners running inside that segment.</desc>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8b8880"/>
    </marker>
    <marker id="arr-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#0e7f72"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1020" height="700" fill="#ffffff"/>

  <!-- identity -->
  <rect x="430" y="26" width="250" height="58" rx="9" fill="#ffffff" stroke="#e6e4e0"/>
  <text x="555" y="50" text-anchor="middle" font-family="Manrope, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#1b1b18">Entra ID · OIDC</text>
  <text x="555" y="68" text-anchor="middle" font-family="Manrope, Helvetica, Arial, sans-serif" font-size="11.5" fill="#5c5a54">single sign-on, auto-provisioning</text>
  <line x1="555" y1="84" x2="555" y2="150" stroke="#8b8880" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="567" y="112" font-family="ui-monospace, Menlo, monospace" font-size="10" fill="#6c6961">SSO</text>

  <!-- container platform -->
  <rect x="55" y="122" width="910" height="168" rx="14" fill="none" stroke="#d8d5cf" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="72" y="144" font-family="ui-monospace, Menlo, monospace" font-size="10.5" letter-spacing="1.4" fill="#6c6961">CONTAINER PLATFORM</text>

  <text x="8" y="200" font-family="ui-monospace, Menlo, monospace" font-size="11" fill="#5c5a54">HTTPS</text>
  <text x="8" y="215" font-family="ui-monospace, Menlo, monospace" font-size="11" fill="#6c6961">:443</text>
  <line x1="58" y1="196" x2="126" y2="196" stroke="#8b8880" stroke-width="1.5" marker-end="url(#arr)"/>

  <rect x="130" y="160" width="180" height="72" rx="9" fill="#f3f2f0" stroke="#e6e4e0"/>
  <text x="220" y="190" text-anchor="middle" font-family="Manrope, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#1b1b18">Caddy</text>
  <text x="220" y="208" text-anchor="middle" font-family="Manrope, Helvetica, Arial, sans-serif" font-size="11.5" fill="#5c5a54">reverse proxy · TLS termination</text>

  <line x1="310" y1="196" x2="426" y2="196" stroke="#8b8880" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="368" y="188" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="10" fill="#6c6961">:8000</text>

  <rect x="430" y="152" width="250" height="88" rx="9" fill="rgba(18,165,148,0.08)" stroke="#12a594" stroke-width="1.5"/>
  <text x="555" y="186" text-anchor="middle" font-family="Manrope, Helvetica, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#0e7f72">Post Quantum Leap</text>
  <text x="555" y="206" text-anchor="middle" font-family="Manrope, Helvetica, Arial, sans-serif" font-size="11.5" fill="#5c5a54">application and web interface</text>
  <text x="555" y="223" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="10.5" fill="#6c6961">one image</text>

  <line x1="680" y1="196" x2="726" y2="196" stroke="#8b8880" stroke-width="1.5" marker-end="url(#arr)"/>

  <rect x="730" y="160" width="190" height="72" rx="9" fill="#f3f2f0" stroke="#e6e4e0"/>
  <text x="825" y="190" text-anchor="middle" font-family="Manrope, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#1b1b18">PostgreSQL 16</text>
  <text x="825" y="208" text-anchor="middle" font-family="Manrope, Helvetica, Arial, sans-serif" font-size="11.5" fill="#5c5a54">persistent volume</text>

  <text x="72" y="272" font-family="Manrope, Helvetica, Arial, sans-serif" font-size="11.5" fill="#6c6961">Docker · Podman · Azure Container Instances · Kubernetes</text>

  <!-- enterprise integration -->
  <rect x="55" y="352" width="910" height="128" rx="14" fill="none" stroke="#d8d5cf" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="72" y="374" font-family="ui-monospace, Menlo, monospace" font-size="10.5" letter-spacing="1.4" fill="#6c6961">ENTERPRISE INTEGRATION</text>

  <rect x="130" y="390" width="200" height="70" rx="9" fill="#ffffff" stroke="#e6e4e0"/>
  <text x="230" y="418" text-anchor="middle" font-family="Manrope, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#1b1b18">Enterprise proxy</text>
  <text x="230" y="436" text-anchor="middle" font-family="Manrope, Helvetica, Arial, sans-serif" font-size="11.5" fill="#5c5a54">optional, scans traverse it</text>

  <rect x="700" y="390" width="250" height="70" rx="9" fill="#ffffff" stroke="#12a594" stroke-width="1.5"/>
  <text x="825" y="418" text-anchor="middle" font-family="Manrope, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#0e7f72">Bifröst remote engine</text>
  <text x="825" y="436" text-anchor="middle" font-family="Manrope, Helvetica, Arial, sans-serif" font-size="11.5" fill="#5c5a54">runs inside the isolated segment</text>

  <path d="M 480 240 L 480 320 L 270 320 L 270 386" fill="none" stroke="#8b8880" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="330" y="312" font-family="Manrope, Helvetica, Arial, sans-serif" font-size="11.5" fill="#5c5a54">scans TLS endpoints</text>

  <path d="M 825 386 L 825 330 L 630 330 L 630 244" fill="none" stroke="#0e7f72" stroke-width="1.75" marker-end="url(#arr-teal)"/>
  <text x="660" y="304" font-family="ui-monospace, Menlo, monospace" font-size="10.5" fill="#0e7f72">outbound only</text>
  <text x="660" y="319" font-family="Manrope, Helvetica, Arial, sans-serif" font-size="11" fill="#5c5a54">the engine dials in</text>

  <!-- your estate -->
  <rect x="55" y="520" width="910" height="150" rx="14" fill="#fbfaf9" stroke="#e6e4e0"/>
  <text x="72" y="544" font-family="ui-monospace, Menlo, monospace" font-size="10.5" letter-spacing="1.4" fill="#6c6961">YOUR INFRASTRUCTURE</text>

  <rect x="130" y="562" width="200" height="76" rx="9" fill="#ffffff" stroke="#e6e4e0"/>
  <text x="230" y="592" text-anchor="middle" font-family="Manrope, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#1b1b18">Network endpoints</text>
  <text x="230" y="610" text-anchor="middle" font-family="Manrope, Helvetica, Arial, sans-serif" font-size="11.5" fill="#5c5a54">TLS services, any port</text>

  <rect x="430" y="562" width="250" height="76" rx="9" fill="#ffffff" stroke="#12a594" stroke-width="1.5"/>
  <text x="555" y="588" text-anchor="middle" font-family="Manrope, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#0e7f72">Client scanner</text>
  <text x="555" y="606" text-anchor="middle" font-family="Manrope, Helvetica, Arial, sans-serif" font-size="11.5" fill="#5c5a54">Linux, Windows and macOS</text>
  <text x="555" y="623" text-anchor="middle" font-family="Manrope, Helvetica, Arial, sans-serif" font-size="11.5" fill="#5c5a54">runs on the host itself</text>

  <rect x="700" y="562" width="250" height="76" rx="9" fill="#ffffff" stroke="#e6e4e0"/>
  <text x="825" y="592" text-anchor="middle" font-family="Manrope, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#1b1b18">Isolated hosts · DMZ</text>
  <text x="825" y="610" text-anchor="middle" font-family="Manrope, Helvetica, Arial, sans-serif" font-size="11.5" fill="#5c5a54">no route from the server</text>

  <line x1="270" y1="460" x2="270" y2="558" stroke="#8b8880" stroke-width="1.5" marker-end="url(#arr)"/>

  <line x1="605" y1="558" x2="605" y2="244" stroke="#0e7f72" stroke-width="1.75" marker-end="url(#arr-teal)"/>
  <text x="615" y="500" font-family="ui-monospace, Menlo, monospace" font-size="10.5" fill="#0e7f72">CBOM</text>
  <text x="615" y="516" font-family="Manrope, Helvetica, Arial, sans-serif" font-size="11" fill="#5c5a54">submitted to the API</text>

  <line x1="825" y1="460" x2="825" y2="558" stroke="#0e7f72" stroke-width="1.75" marker-start="url(#arr-teal)" marker-end="url(#arr-teal)"/>
  <text x="838" y="496" font-family="Manrope, Helvetica, Arial, sans-serif" font-size="11" fill="#5c5a54">scans, and relays the</text>
  <text x="838" y="512" font-family="Manrope, Helvetica, Arial, sans-serif" font-size="11" fill="#5c5a54">client scanner's CBOM</text>
</svg>
